<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Citizen Connect</title>

<link rel="stylesheet" href="style2.css"?v=80>

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* LOGIN BOX */
.login-box {
    width: 360px;
    padding: 35px;
    border-radius: 20px;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.12);
    text-align: center;
    color: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    animation: fadeIn 1s ease;
}

/* FADE ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* INPUT ICON STYLE */
.input-box {
    position: relative;
}

.input-box i {
    position: absolute;
    left: 12px;
    top: 12px;
    color: #ccc;
}

.input-box input {
    width: 100%;
    padding: 12px 12px 12px 35px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

.input-box input::placeholder{
    color:#ddd;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(to right,#ff7e5f,#feb47b);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* LINKS */
.links {
    margin-top: 15px;
}

.links a {
    color: #ddd;
    text-decoration: none;
    font-size: 14px;
    margin: 0 10px;
    transition: 0.3s;
}

.links a:hover {
    color: #00c6ff;
}

/* TITLE ICON */
.title-icon {
    font-size: 30px;
    margin-bottom: 10px;
    color: #00c6ff;
}

/* BUBBLES */
.bubbles span{
    position:absolute;
    width:20px;
    height:20px;
    background:rgba(0,255,255,0.3);
    border-radius:50%;
    animation: float 10s infinite;
}

@keyframes float{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-10vh);}
}

</style>

</head>

<body>

<!-- BUBBLES -->
<div class="bubbles">
  <span style="left:10%"></span>
  <span style="left:20%"></span>
  <span style="left:30%"></span>
  <span style="left:40%"></span>
  <span style="left:50%"></span>
  <span style="left:60%"></span>
  <span style="left:70%"></span>
  <span style="left:80%"></span>
  <span style="left:90%"></span>
</div>

<div class="login-box">

<i class="fas fa-city title-icon"></i>

<h2>Citizen Connect</h2>
<p>Login to your account</p>

<form action="login.php" method="POST">

<div class="input-box">
<i class="fas fa-user"></i>
<input type="text" name="username" placeholder="Username" required>
</div>

<div class="input-box">
<i class="fas fa-lock"></i>
<input type="password" name="password" placeholder="Password" required>
</div>

<button name="login">Login</button>

</form>

<div class="links">
<a href="register.php"><i class="fas fa-user-plus"></i> Register</a> |
<a href="forgot.php"><i class="fas fa-key"></i> Forgot Password?</a>
</div>

</div>

</body>
</html>
